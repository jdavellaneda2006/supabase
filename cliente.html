<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi cuenta</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600&family=Pacifico&display=swap" />
    <link rel="stylesheet" href="css/gta6.css" />
  </head>
  <body>
    <!-- Menú: cada enlace salta a la sección con ese id -->
    <nav class="barra-superior">
      <div class="menu">
        <a href="#panel-cuenta">Mi cuenta</a>
        <a href="#sec-tienda">Productos tienda</a>
        <a href="#sec-carrito">Carrito (<span id="contador-carrito">0</span>)</a>
      </div>
    </nav>

    <header class="encabezado">
      <h1>Mi cuenta<span>Zona de clientes</span></h1>
    </header>

    <main>
      <section id="panel-cuenta">
        <p id="estado-sesion">No has iniciado sesión.</p>

        <div id="formularios-cuenta">
          <form id="form-login">
            <h2>Iniciar sesión</h2>
            <label for="login-correo">Correo</label>
            <input id="login-correo" type="email" required />

            <label for="login-password">Contraseña</label>
            <input id="login-password" type="password" required />

            <button type="submit">Iniciar sesión</button>
          </form>

          <form id="form-registro">
            <h2>Registrarme</h2>
            <label for="registro-nombre">Nombre</label>
            <input id="registro-nombre" type="text" required />

            <label for="registro-correo">Correo</label>
            <input id="registro-correo" type="email" required />

            <label for="registro-password">Contraseña</label>
            <input id="registro-password" type="password" minlength="6" required />

            <button type="submit">Crear cuenta</button>
          </form>
        </div>

        <!-- Solo se ve con la sesión iniciada: lo controla mostrarEstadoSesion() -->
        <div id="mis-datos" hidden>
          <h2>Mis datos</h2>
          <dl id="lista-datos"></dl>
          <button id="btn-logout" type="button">Cerrar sesión</button>
        </div>
      </section>

      <!-- ===== Productos tienda: las mismas cards que en admin.html,
           con "Agregar al carrito" en vez de Editar / Eliminar ===== -->
      <section id="sec-tienda" class="seccion">
        <h2><span class="num">01</span> Productos tienda</h2>
        <div id="lista-tienda">
          <p class="aviso-tienda">Cargando productos…</p>
        </div>
      </section>

      <!-- ===== Carrito de compras: lo dibuja pintarCarrito() en tienda.js ===== -->
      <section id="sec-carrito" class="seccion">
        <h2><span class="num">02</span> Carrito de compras</h2>
        <div id="lista-carrito"></div>
        <div id="resumen-carrito" hidden>
          <p class="total-carrito">Total: <strong id="total-carrito"></strong></p>
          <button id="btn-vaciar-carrito" type="button">Vaciar carrito</button>
        </div>
      </section>
    </main>

    <script src="js/supabaseClient.js"></script>
    <script src="js/cliente.js"></script>
    <!-- cards.js dibuja las cards (el mismo que usa admin.html);
         tienda.js lo usa, por eso va antes -->
    <script src="js/cards.js"></script>
    <script src="js/tienda.js"></script>
  </body>
</html>
