<!DOCTYPE html>
<html>
<head>
  <!-- CDN: trae la librería de Supabase ANTES que nuestros propios
       scripts — sin esta línea, "supabase.createClient" no existiría
       todavía cuando supabaseClient.js intente usarlo -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos</title>
  <!-- Fuentes y hoja de estilos inspirada en GTA VI -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600&family=Pacifico&display=swap">
  <link rel="stylesheet" href="css/gta6.css">
</head>
<body>

  <h1>Productos<span>Vice City Edition</span></h1>

  <!-- Formulario para agregarProducto() en prueba.js -->
  <form id="form-agregar">
    <input id="input-nombre" type="text" placeholder="Nombre" required>
    <input id="input-descripcion" type="text" placeholder="Descripción">
    <input id="input-precio" type="number" placeholder="Precio" min="0" step="any" required>
    <input id="input-unidades" type="number" placeholder="Unidades" min="0" step="1" required>
    <input id="input-descuento" type="number" placeholder="Descuento %" min="0" max="100" step="any">
    <button type="submit">Agregar producto</button>
  </form>
  <div id="notificacion"></div>

  <!-- Formularios para buscarProductoPorId() y buscarProductosPorNombre() -->
  <form id="form-buscar-id">
    <input id="input-buscar-id" type="number" placeholder="Buscar por ID" min="1" required>
    <button type="submit">Buscar</button>
  </form>
  <form id="form-buscar-nombre">
    <input id="input-buscar-nombre" type="text" placeholder="Buscar por nombre" required>
    <button type="submit">Buscar</button>
  </form>
  <div id="resultado-busqueda"></div>

  <div id="notificacion-mod"></div>

  <button id="btn-traer">Traer productos</button>
  <div id="resultado"></div>
  <!-- Lista de productos con botón "Editar" (abre el modal) -->
  <div id="lista-productos"></div>
   <div id="resultado2"></div>
   <div id="resultado3"></div>
   <div id="resultado4"></div>

  <!-- Modal para modificarProducto(): <dialog> es un elemento nativo de
       HTML que ya sabe abrirse encima de la página (showModal()) y
       cerrarse con la tecla Esc -->
  <dialog id="modal-editar">
    <form id="form-editar">
      <h2>Editar producto <span id="modal-titulo-id"></span></h2>
      <input id="edit-id" type="hidden">
      <label>Nombre
        <input id="edit-nombre" type="text" required>
      </label>
      <label>Descripción
        <input id="edit-descripcion" type="text">
      </label>
      <label>Precio
        <input id="edit-precio" type="number" min="0" step="any" required>
      </label>
      <label>Unidades
        <input id="edit-unidades" type="number" min="0" step="1" required>
      </label>
      <label>Descuento %
        <input id="edit-descuento" type="number" min="0" max="100" step="any">
      </label>
      <div class="modal-botones">
        <button type="button" id="btn-cancelar">Cancelar</button>
        <button type="submit">Guardar cambios</button>
      </div>
    </form>
  </dialog>
  <!-- supabaseClient.js crea "db" (sección 4.3): el cliente ya
       conectado a tu proyecto de Supabase. Lo vamos a usar en
       prueba.js, por eso tiene que cargarse ANTES que ese archivo -->
  <script src="js/supabaseClient.js"></script>
  <!-- prueba.js: aquí escribes el código de los Pasos 2, 3 y 4 -->
  <script src="js/prueba.js"></script>
</body>
</html>
